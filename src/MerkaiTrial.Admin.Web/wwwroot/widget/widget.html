<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>MerkaiTrial Widget (Demo)</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-3">
  <div class="card shadow-sm">
    <div class="card-header">How can we help?</div>
    <div class="card-body">
      <div class="mb-2"><input id="name" class="form-control" placeholder="Name"/></div>
      <div class="mb-2"><input id="email" class="form-control" placeholder="Email"/></div>
      <div class="mb-2"><input id="phone" class="form-control" placeholder="Phone"/></div>
      <button class="btn btn-primary" onclick="send()">Send</button>
      <div id="msg" class="mt-3 text-success"></div>
    </div>
  </div>
<script>
async function send(){
  const body = {
    name: document.getElementById('name').value,
    email: document.getElementById('email').value,
    phone: document.getElementById('phone').value,
    source: 'widget-demo',
    customFieldsJson: JSON.stringify({utm:'demo'})
  };
  const r = await fetch('http://localhost:5099/api/widget/lead', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  const j = await r.json();
  document.getElementById('msg').innerText = 'Thanks! Lead ID: ' + j.leadId;
}
</script>
</body>
</html>
